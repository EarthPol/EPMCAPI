networking:
  # Use a reverse proxy with TLS and request/read timeouts.
  host: 127.0.0.1
  port: 8080
  url_path: astra
  public_url: http://localhost:8080
  workers: 5
  queue_capacity: 25
  max_body_bytes: 65536
  max_query_items: 100
  # Pagination is optional; limit cannot exceed this value.
  max_page_size: 100
  game_thread_timeout_ms: 2000
  request_timeout_ms: 15000
  compression:
    enabled: true
    min_bytes: 1024
    strict_accept_encoding_parsing: true
  snapshot_cache_ms:
    server: 1000
    list: 5000
  cors:
    allowed_origins: ["*"]
    allow_credentials: false
    enabled: true
endpoints:
  towns: true
  nations: true
  players: true
  shops: true
  location: true
  discord: false
  quarters: true
  chat: false
  voting: true
  siegewar: false
chat-endpoint:
  max-filter-items: 20
  max-string-length: 200
  max-results: 100
  # Chat is unavailable until allowed channels are explicitly configured.
  allowed-channels: []
players-endpoint:
  premium_cache_ms: 30000
  permission_timeout_ms: 3000
  max_filter_candidates: 10000
shops-endpoint:
  owner_lookup_cache_ms: 5000
  # 0 disables caching. Stock and prices refresh every 5 seconds by default.
  list_cache_ms: 5000
  # Empty means all worlds. max_price is inclusive; -1 means no price cap.
  allowed_worlds: []
  max_price: -1
  # When false, omit finite selling shops with no stock and buying shops with no space.
  include_out_of_stock: true
database:
  query_timeout_seconds: 5
mysql-discord:
  host: localhost
  port: 3306
  user: ""
  pass: ""
  database: ""
mysql-chat:
  host: localhost
  port: 3306
  user: ""
  pass: ""
  database: ""
