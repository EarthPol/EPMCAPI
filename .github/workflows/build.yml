name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn --batch-mode --no-transfer-progress -Dmaven.test.skip=true package
      - name: Checksum
        run: cd target && sha256sum EPMCAPI-*.jar > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: EPMCAPI-${{ github.sha }}
          path: |
            target/EPMCAPI-*.jar
            target/SHA256SUMS
          if-no-files-found: error
